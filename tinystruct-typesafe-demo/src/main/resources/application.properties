# ============================================================
# tinystruct-typesafe-demo configuration
# ============================================================

# Applications loaded on every start, so bin/dispatcher needs no --import (tinystruct's own setting, ';'-separated).
default.import.applications=org.tinystruct.typesafe.core.SemanticDispatcher;org.tinystruct.typesafe.workflow.SemanticConfirmApplication;org.tinystruct.typesafe.demo.UserManagementApplication;org.tinystruct.typesafe.demo.CrmApplication;org.tinystruct.typesafe.demo.HelpDeskApplication

# TypeSafe API key: set the TYPESAFE_API_KEY environment variable, or uncomment (never commit a real key).
typesafe.api-key=$_TYPESAFE_API_KEY
typesafe.endpoint=https://api.typesafe.ai/v1/systemone
# Pin the model in production: jev-latest moves when TypeSafe ships a new version.
typesafe.model=jev-1.13.0

# Only these actions can ever be routed. The default is empty: nothing is routable.
typesafe.routing.allowed-actions=create-user,assign-roles,deactivate-user,delete-user,create-customer,update-customer,delete-customer,create-ticket,escalate-ticket,close-ticket

# Actions that always wait for a human to confirm
typesafe.routing.confirm-actions=delete-user,delete-customer

# Confidence: below min is refused; between min and auto asks for confirmation.
typesafe.routing.min-confidence=0.80
typesafe.routing.auto-confidence=0.90
# A per-action minimum overrides the global one:
typesafe.routing.min-confidence.delete-user=0.95
typesafe.routing.set-threshold=0.5

# single: every question in one request. two-stage: the action first, then only its arguments.
typesafe.routing.strategy=single

# Classification cache: none | memory | redis (redis uses redis.host / redis.port / redis.password)
typesafe.cache.provider=memory
typesafe.cache.ttl=3600

# Confirmation, held as a suspended workflow execution
typesafe.confirmation.service=org.tinystruct.typesafe.workflow.WorkflowConfirmationService
typesafe.routing.confirmation-timeout-seconds=300
# file (or redis / database) is required from the command line: every bin/dispatcher call is its own JVM.
typesafe.workflow.repository=file
typesafe.workflow.snapshot-dir=workflow-snapshots/
typesafe.workflow.keep-completed=false

# Do not log argument values (they can be personal data)
typesafe.logging.log-arguments=false

logging.enabled=true
logging.level=INFO
